# Declarative service-account creation for the parzival broker daemon
# Applied via:
#
#   sudo cp packaging/sysusers.d/parzival-broker.conf /etc/sysusers.d/
#   sudo systemd-sysusers /etc/sysusers.d/parzival-broker.conf
#
# `u` creates a system account (uid < 1000, no login shell) with its home
# directory set to the state directory systemd's StateDirectory= (in
# parzival-broker.service) also creates — the account and its data live in
# the same place. See INSTALL.md for the full installation sequence.
#
# `g parzival-clients` is a *separate*, deliberately narrower
# group from parzival-broker above: it grants nothing but the ability to
# reach the broker's AF_UNIX socket (see internal/broker's
# setSocketGroupAndMode and parzival-broker.service's SupplementaryGroups=
# below). It must never be reused for, or conflated with, the
# parzival-broker group's actual purpose — read/traverse access to
# /etc/parzival-broker's trusted consumer/profile/authz files. Membership in
# parzival-clients grants zero broker operations by itself; SO_PEERCRED plus
# authz.json's uid-based rules still decide that per request. The package
# never adds any account to this group automatically — an administrator
# adds their own intended local users by hand (see packaging/README.md and
# INSTALL.md).
#
#Type Name              ID  GECOS                               Home directory              Shell
u     parzival-broker    -  "parzival broker service account"   /var/lib/parzival-broker    -
g     parzival-clients   -
