# Production release workflow for github.com/kevinpinscoe/parzival.
#
# Pipeline: approved version tag -> release validation (fail-closed release
# notes + privacy scan) -> GoReleaser build (binaries, RPM/DEB, SBOMs,
# checksums, keyless cosign/Sigstore signing of checksums.txt, Homebrew
# cask rendering) -> SBOM assertion -> full artifact leak scan -> stage
# exactly the GitHub-Release-bound assets -> create/resume a DRAFT GitHub
# Release -> verify the draft's full inventory -> publish the draft ->
# publish the Homebrew cask -> RPM repository dispatch -> APT repository
# dispatch.
#
# This is additive to, never a loosened version of, verify.yml — that
# workflow stays permanently non-publishing (see its own header comment).
#
# BUILD -> SIGN -> SBOM -> FULL LEAK SCAN -> PUBLICATION is the invariant
# this file exists to preserve. GoReleaser OSS has no way to split "build"
# and "publish" into two separate CLI invocations against the same dist/ —
# that split (`goreleaser publish` / `goreleaser continue`) is a GoReleaser
# Pro feature only. v0.1.0-pre.1's real release run discovered this the
# hard way: its "GoReleaser publish" step called a command
# (`goreleaser publish --clean`) that does not exist in the OSS
# distribution, and failed there — after the build, sign, SBOM, and full
# leak scan phases had already succeeded against the real release
# artifacts, so nothing was ever published (verified: zero GitHub Releases,
# kevinpinscoe/homebrew-tap / rpm / apt all unchanged). v0.1.0-pre.1 stays
# tagged, at that failed state, as a historical record — it is never
# retagged, moved, or force-updated, and is not "repaired" by this fix.
#
# So this workflow keeps GoReleaser OSS for exactly what it already does
# well — build, package, SBOM, checksum, keyless-sign, and render the
# Homebrew cask, all still landing in dist/ before the leak scan runs — and
# does everything after the leak scan (the actual publication) with
# explicit `gh`/GitHub-API steps instead of a nonexistent GoReleaser
# command. Neither GoReleaser Pro nor collapsing build+publish into one
# `goreleaser release --clean` invocation was chosen: the former needs a
# paid license this project doesn't carry, the latter would let a leak
# finding surface only after the GitHub Release and Homebrew cask already
# went out — exactly the ordering this pipeline exists to prevent.
#
# Every publication step below (`scripts/release/publish-github-release.sh`,
# the plain `gh release edit --draft=false` step, and
# `scripts/release/publish-homebrew-cask.sh`) is written to be safely
# rerun: each one first checks whether its own public side effect already
# happened — a matching draft or published release, an identical cask blob
# — and resumes or no-ops rather than blindly repeating a create/upload
# that already landed, or overwriting state that doesn't match what this
# run expects (which it refuses instead, fail-closed). See each script's
# own header for its exact resume/no-op/refuse rules. The two repository
# dispatches stay last, run only once the GitHub Release is published and
# the Homebrew cask publication is verified, since kevinpinscoe/apt and
# kevinpinscoe/rpm both fetch release assets by tag immediately on receipt.
#
# Reuses the exact tool pins and permission shape already proven in
# production by kevinpinscoe/get-wx and kevinpinscoe/metar-tool's own
# release.yml, inspected directly rather than reconstructed from memory:
# same actions/checkout and actions/setup-go pins already used in
# verify.yml, same sigstore/cosign-installer pin get-wx uses, same
# goreleaser-action pin, same `contents: write` + `id-token: write`
# permission pair, same two `gh api .../dispatches` calls with the same
# event_type (`new-release`) and payload shape
# (`client_payload[repo]`/`client_payload[tag]`) both kevinpinscoe/rpm and
# kevinpinscoe/apt already consume — confirmed identical for both consumers
# by reading their live `add-package.yml` workflows, not assumed. Those two
# dispatch steps and their payload contract are unchanged by this fix.
#
# GoReleaser stays pinned to the exact v2.17.1 verify.yml already uses
# (not get-wx/metar-tool's floating "~> v2" range) — deliberate, per
# verify.yml's own comment: no mise.toml entry exists yet for GoReleaser,
# so these workflows are the single source of truth for the version in use,
# and a bump should be a deliberate, separately-validated change.

name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-pre.[0-9]+'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # contents: write — create the GitHub Release and upload its assets.
    # id-token: write — required for keyless Sigstore/cosign OIDC signing.
    # Scoped to this one job only; verify.yml's job carries neither.
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # Fail closed before any build work happens: no hand-authored,
      # leakage-clean release-notes.md, no release. No `--snapshot`
      # tolerance here — this is the production path.
      - name: Require release notes
        run: bash scripts/release/require-release-notes.sh

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - uses: anchore/sbom-action/download-syft@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2

      # rpm/rpm2cpio/cpio: needed by scan-release-artifacts.sh to extract and
      # sweep .rpm contents below. Same tools verify.yml installs, same
      # reason (extracting a package to scan its real contents).
      - name: Install package-inspection tools
        run: sudo apt-get update -y && sudo apt-get install -y rpm cpio

      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: v2.17.1
          args: check

      # Phase 1 of 2 — build only, never publish. Signs (keyless cosign),
      # generates SBOMs, renders the nfpm/cask configs — everything lands in
      # dist/, nothing leaves this runner yet. The whole point of a separate
      # build phase is that the leak scan below runs against real release
      # artifacts BEFORE anything is published, not after. Collapsing this
      # into a single `goreleaser release --clean` (build+publish together)
      # would let a real leak finding surface only after the GitHub Release
      # and Homebrew cask already went out — exactly the ordering a release
      # approval gate requires catching before publication, not after.
      - name: GoReleaser build (publish deferred)
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: v2.17.1
          args: release --clean --skip=publish --release-notes release-notes.md

      # Same SBOM-presence assertion verify.yml runs, against the real
      # release build's dist/artifacts.json this time.
      - name: Assert SBOM artifacts were actually generated
        run: |
          count=$(jq '[.[] | select(.type == "SBOM")] | length' dist/artifacts.json)
          echo "SBOM artifacts in dist/artifacts.json: $count"
          if [[ "$count" -eq 0 ]]; then
            echo "::error::.goreleaser.yml declares an sboms: block but zero SBOM-typed artifacts were produced."
            exit 1
          fi
          jq -r '.[] | select(.type == "SBOM") | "  " + .name' dist/artifacts.json

      # Full-strength scan against the real release build, no --snapshot
      # tolerance. A real finding here fails the job — nothing below this
      # step (publish, then the two repository dispatches) can run before
      # it passes.
      - name: Scan release artifacts for private-data leaks
        run: bash scripts/release/scan-release-artifacts.sh dist

      # Phase 2 of 2 — only reached if the leak scan above passed. Reads
      # dist/artifacts.json and copies exactly the assets a GitHub Release
      # should carry into dist/release-assets/, under their GoReleaser
      # `name` as filename, refusing (fail-closed) if the count or class of
      # anything looks wrong. See the script's own header for the exact
      # selection rules and why type alone can't be used to tell a
      # publication-bound artifact from GoReleaser's other dist/ output.
      - name: Stage GitHub Release assets
        run: bash scripts/release/stage-release-assets.sh dist dist/release-assets

      # Creates the release for this tag as a DRAFT (never published here),
      # or safely resumes one from a previous failed run, then verifies its
      # full asset inventory against dist/release-assets/manifest.json
      # before exiting 0. See the script's own header for its exact
      # create/resume/refuse rules. Nothing below this step can run before
      # it passes.
      - name: Create and verify draft GitHub Release
        run: bash scripts/release/publish-github-release.sh "${{ github.ref_name }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # The first point at which release artifacts become publicly
      # available. Only reached once the draft above is verified. Safe to
      # rerun: toggling an already-published release's draft flag to
      # false again is a no-op.
      - name: Publish GitHub Release
        run: |
          gh release edit "${{ github.ref_name }}" \
            --draft=false --prerelease --latest=false --verify-tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Publishes the already-rendered, already-leak-scanned cask exactly
      # as GoReleaser wrote it — never regenerated here. Uses the Contents
      # API directly (create, or update by current blob sha) rather than
      # another release framework; idempotent if the tap's copy already
      # matches. GH_TOKEN is scoped here to the dedicated
      # HOMEBREW_TAP_TOKEN (Contents: write on kevinpinscoe/homebrew-tap
      # only) — this step's own `gh api` calls never see the broader
      # GITHUB_TOKEN above, and this script never prints the token's value.
      - name: Publish Homebrew cask
        run: bash scripts/release/publish-homebrew-cask.sh
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}

      # REPO_DISPATCH_TOKEN: a fine-grained PAT dedicated to this repo,
      # scoped to Contents: write on kevinpinscoe/apt and kevinpinscoe/rpm
      # only. Must exist as a secret on this repo before this workflow's
      # first real run. Dispatched only after the GitHub Release is
      # published and the Homebrew cask publication is verified above,
      # since kevinpinscoe/apt and kevinpinscoe/rpm both download release
      # assets by tag immediately on receipt.
      - name: Notify apt repo
        run: |
          gh api repos/kevinpinscoe/apt/dispatches \
            --method POST \
            --field event_type=new-release \
            --field client_payload[repo]="${{ github.repository }}" \
            --field client_payload[tag]="${{ github.ref_name }}"
        env:
          GH_TOKEN: ${{ secrets.REPO_DISPATCH_TOKEN }}

      - name: Notify rpm repo
        run: |
          gh api repos/kevinpinscoe/rpm/dispatches \
            --method POST \
            --field event_type=new-release \
            --field client_payload[repo]="${{ github.repository }}" \
            --field client_payload[tag]="${{ github.ref_name }}"
        env:
          GH_TOKEN: ${{ secrets.REPO_DISPATCH_TOKEN }}
